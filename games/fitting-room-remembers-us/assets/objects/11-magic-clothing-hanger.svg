<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 520" role="img" aria-labelledby="asset-title asset-desc">
  <title id="asset-title">Magic Clothing Hanger</title><desc id="asset-desc">A pastel-pink wooden hanger with flowers, ribbon, star charm, enormous googly eyes, and a curious smile.</desc>
