<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" role="img" aria-labelledby="asset-title asset-desc">
  <title id="asset-title">Interactive Question Object</title><desc id="asset-desc">A rounded blue-and-pink rubber-hose question-mark character expressing playful curiosity.</desc>
  <defs>
    <linearGradient id="blue-gradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9edf6"/><stop offset="1" stop-color="#91c5df"/></linearGradient>
    <linearGradient id="pink-gradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd7e4"/><stop offset="1" stop-color="#efa6c2"/></linearGradient>
    <linearGradient id="glass-gradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="0.5" stop-color="#dcf2f7"/><stop offset="1" stop-color="#e7ddf3"/></linearGradient>
    <filter id="soft-shadow" x="-25%" y="-25%" width="150%" height="165%"><feGaussianBlur in="SourceAlpha" stdDeviation="8" result="b"/><feOffset in="b" dy="8" result="o"/><feFlood flood-color="#6f7598" flood-opacity="0.2" result="c"/><feComposite in="c" in2="o" operator="in" result="s"/><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="paper-grain" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="5" cy="8" r="0.8" fill="#fff" opacity="0.28"/><circle cx="23" cy="24" r="0.7" fill="#596486" opacity="0.06"/><path d="M10 27l4-1M25 7l3 2" stroke="#fff" stroke-width="0.7" opacity="0.22"/></pattern>
    <pattern id="gingham" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M0 16h64M0 48h64M16 0v64M48 0v64" stroke="#fff" stroke-width="6" opacity="0.18"/></pattern>
  </defs>
  <style>.outline{stroke:#596486;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.detail{stroke:#7b79a0;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.fine{stroke:#7b79a0;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style>

  <ellipse cx="300" cy="711" rx="150" ry="23" fill="#7b79a0" opacity=".2"/><g id="question-character" filter="url(#soft-shadow)"><path d="M161 187c5-120 95-162 198-142 111 22 145 159 70 228-34 31-82 35-91 80l-11 60H215l8-82c7-76 85-90 111-116 27-27 11-71-34-75-41-4-61 18-67 65z" fill="url(#blue-gradient)" class="outline"/><circle cx="270" cy="560" r="79" fill="url(#pink-gradient)" class="outline"/><g id="question-face"><g id="question-eye-left" transform="rotate(-5 267.6 265)"><ellipse cx="267.6" cy="265" rx="28.799999999999997" ry="33.6" fill="#fffdf8" class="detail"/><ellipse id="question-pupil-left" cx="277.2" cy="273.4" rx="10.799999999999999" ry="14.399999999999999" fill="#3e4565"/><circle cx="273.6" cy="268.6" r="3.5999999999999996" fill="white"/></g><g id="question-eye-right" transform="rotate(6 332.4 265)"><ellipse cx="332.4" cy="265" rx="28.799999999999997" ry="33.6" fill="#fffdf8" class="detail"/><ellipse id="question-pupil-right" cx="322.8" cy="272.2" rx="10.799999999999999" ry="14.399999999999999" fill="#3e4565"/><circle cx="319.2" cy="267.4" r="3.5999999999999996" fill="white"/></g><ellipse cx="231.60000000000002" cy="303.4" rx="16.8" ry="8.4" fill="#f5c2ab" opacity=".75"/><ellipse cx="368.4" cy="303.4" rx="16.8" ry="8.4" fill="#f5c2ab" opacity=".75"/><path id="question-mouth" d="M282 315.4q21.599999999999998 20.4 38.4-3.5999999999999996" fill="none" class="detail"/></g><g id="question-arms"><path d="M188 354q-86 25-97 111M386 351q87 17 111 97" fill="none" class="outline"/><circle cx="88" cy="474" r="24" fill="#ffd9e6" class="outline"/><circle cx="505" cy="454" r="24" fill="#ffd9e6" class="outline"/></g><g id="question-sparkles"><path d="M110 127.4l4.5 8.1 8.1 4.5-8.1 4.5-4.5 8.1-4.5-8.1-8.1-4.5 8.1-4.5z" fill="#efc56c" class="fine"/><path d="M493 256.5l3.75 6.75 6.75 3.75-6.75 3.75-3.75 6.75-3.75-6.75-6.75-3.75 6.75-3.75z" fill="#fff8e8" class="fine"/><path d="M436 584.6l3 5.3999999999999995 5.3999999999999995 3-5.3999999999999995 3-3 5.399999999999999